<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小夜 · 布丁与猫的黑猫少女</title>
<style>
/* ===== 基础重置 & CSS 变量 ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #2A1F14;
  --bg-warm: #3D2B1F;
  --cream: #FFF8EE;
  --amber: #E8A33D;
  --purple: #7B5EAF;
  --pudding: #F5DFA1;
  --caramel: #8C5A3B;
  --salt-caramel: #B87F4A;
  --bg-card: rgba(61, 43, 31, 0.85);
}
html { scroll-behavior: smooth; user-select: none; -webkit-user-select: none; }
body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-deep);
  color: var(--cream);
  line-height: 1.9;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
  cursor: url("assets/miliko-cursor.cur"), url("assets/miliko-cursor.png") 3 3, auto;
}
* { user-select: none; -webkit-user-select: none; }
button, a { cursor: pointer; }
input, textarea, [contenteditable] { user-select: text; -webkit-user-select: text; cursor: text; }
::selection { background: rgba(232, 163, 61, 0.3); color: var(--cream); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--caramel); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--amber); }

/* ===== Hero 区块 ===== */
#hero {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  background: radial-gradient(ellipse at 50% 60%, rgba(232, 163, 61, 0.15) 0%, transparent 60%),
              var(--bg-deep);
}
#hero-bg {
  position: absolute; inset: 0; z-index: 0;
}
#hero-bg img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0.5; filter: blur(0);
}
#hero-content {
  position: relative; z-index: 2; text-align: center;
  padding: 40px 20px;
}
#hero-content h1 {
  font-family: "Noto Serif SC", "SimSun", serif;
  font-size: 4.5em; font-weight: 700;
  background: linear-gradient(135deg, var(--amber), var(--pudding), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 16px;
  animation: shimmer 4s ease-in-out infinite;
  background-size: 200% auto;
}
@keyframes shimmer {
  0%, 100% { background-position: 0% center; }
  50% { background-position: 100% center; }
}
#hero-content .subtitle {
  font-size: 1.3em; color: var(--pudding); margin-bottom: 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
#hero-content .tagline {
  font-size: 1em; color: rgba(255, 248, 238, 0.85);
  font-style: italic;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
#hero-sticker {
  position: absolute; bottom: 40px; right: 40px; z-index: 3;
  width: 180px; animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-12px) rotate(2deg); }
}

/* ===== 固定圆形按钮 ===== */
#api-guide-link {
  position: fixed; top: 12px; left: 12px; z-index: 200;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(42, 31, 20, 0.7); border: 1px solid rgba(232, 163, 61, 0.5);
  color: var(--amber); font-size: 0.62em; font-weight: 700; letter-spacing: 0.03em;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(6px); transition: all 0.3s;
}
#api-guide-link:hover { background: rgba(232, 163, 61, 0.2); border-color: var(--amber); text-decoration: none; }

/* ===== 音乐按钮 ===== */
#music-toggle {
  position: fixed; top: 12px; right: 12px; z-index: 200;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(42, 31, 20, 0.7); border: 1px solid rgba(232, 163, 61, 0.5);
  color: var(--amber); font-size: 0.8em;
  cursor: pointer; transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
#music-toggle:hover { background: rgba(232, 163, 61, 0.2); border-color: var(--amber); }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  #hero-content h1 { font-size: 2.8em; }
  #hero-sticker { width: 120px; bottom: 20px; right: 20px; }
}
@media (max-width: 480px) {
  #hero-content h1 { font-size: 2em; }
}

/* ===== 减少动画 ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- ===== 区块 1：Hero ===== -->
<section id="hero">
  <div id="hero-bg">
    <img src="assets/立绘/小夜_傍晚橱窗挂营业牌.png" alt="傍晚橱窗" loading="eager">
  </div>
  <div id="hero-content">
    <h1>小夜</h1>
    <div class="subtitle">布丁与猫 · 甜品店的黑猫少女</div>
    <div class="tagline">"那晚的夜色里捡到的孩子，就叫小夜吧"</div>
  </div>
  <img id="hero-sticker" src="assets/Q版/小夜Q_捧布丁.png" alt="Q版小夜">
</section>

<!-- API 新手指南入口 -->
<a id="api-guide-link" href="/api.html" title="API 使用指南" aria-label="打开 API 使用指南">API</a>

<!-- 音乐按钮：只保留首屏右上角的播放/暂停 -->
<button id="music-toggle" title="播放/暂停音乐" aria-label="播放或暂停背景音乐">▶</button>
<video id="bgm" src="assets/music/01-樱之原.mp3" autoplay muted playsinline style="display:none"></video>

<script>
(function () {
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('music-toggle');
  const playlist = [
    'assets/music/01-樱之原.mp3',
    'assets/music/02-海浪海鸥和你.mp3',
    'assets/music/03-星奏.mp3',
    'assets/music/04-Blue-Farewell.mp3',
  ];
  let current = 0;
  let playing = false;
  bgm.volume = 0.3;

  function setUI(v) {
    playing = v;
    btn.textContent = v ? '♪' : '▶';
  }

  btn.addEventListener('click', () => {
    if (playing) {
      bgm.pause();
      setUI(false);
    } else {
      bgm.muted = false;
      bgm.play().then(() => setUI(true)).catch(() => setUI(false));
    }
  });

  bgm.addEventListener('ended', () => {
    current = (current + 1) % playlist.length;
    bgm.src = playlist[current];
    bgm.play().catch(() => {});
  });
})();
</script>
</body>
</html>
