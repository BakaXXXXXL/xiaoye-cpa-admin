<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPA 只读管理台 · 小夜</title>
<style>
:root{--bg:#21180f;--card:rgba(61,43,31,.8);--cream:#fff8ee;--muted:rgba(255,248,238,.65);--amber:#e8a33d;--pudding:#f5dfa1;--line:rgba(255,248,238,.12);--green:#9dcb9a;--red:#ff9b8f;--code:#1e160f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,rgba(123,94,175,.14),transparent 40%),radial-gradient(ellipse at 5% 15%,rgba(232,163,61,.1),transparent 35%),var(--bg);color:var(--cream);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.65}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;background:rgba(42,31,20,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{color:var(--pudding);font-weight:600}.readonly{padding:3px 10px;border:1px solid rgba(157,203,154,.35);border-radius:999px;color:var(--green);font-size:.78em}.wrap{width:min(1240px,calc(100% - 36px));margin:auto;padding:32px 0 60px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:end}h1{margin:0;font:600 2em/1.3 "Noto Serif SC","SimSun",serif}h2{margin:0 0 14px;color:var(--pudding);font-size:1.15em}p{color:var(--muted)}button,input{font:inherit}.refresh,.tab{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--pudding);padding:7px 13px;cursor:pointer}.refresh:hover,.tab:hover,.tab.active{border-color:var(--amber);background:rgba(232,163,61,.12)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:24px 0}.metric{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.metric strong{display:block;color:var(--amber);font-size:1.8em}.metric span{color:var(--muted);font-size:.86em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.search{width:min(360px,100%);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--code);color:var(--cream);outline:none}.search:focus{border-color:var(--amber)}.panel{display:none}.panel.active{display:block}.card{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.9em}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);white-space:nowrap}td{color:var(--cream)}code{color:var(--pudding);font-family:ui-monospace,Consolas,monospace;font-size:.88em}.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78em;background:rgba(157,203,154,.1);color:var(--green)}.pill.off{background:rgba(255,155,143,.1);color:var(--red)}.pill.neutral{color:var(--muted);background:rgba(255,248,238,.06)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{padding:16px;border:1px solid var(--line);border-radius:10px;background:rgba(42,31,20,.45)}.item strong{color:var(--pudding)}.item p{margin:6px 0;font-size:.88em}.channels{display:grid;gap:7px;margin-top:10px}.channel{padding:9px 11px;border-radius:7px;background:var(--code);display:flex;justify-content:space-between;gap:12px}.channel small{color:var(--muted)}.empty{text-align:center;padding:30px;color:var(--muted)}.error{padding:18px;border:1px solid rgba(255,155,143,.4);border-radius:10px;color:var(--red);background:rgba(255,155,143,.06)}.foot{color:var(--muted);font-size:.82em;margin-top:18px;text-align:center}@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.top{padding:12px 16px}.wrap{width:calc(100% - 24px)}}
</style>
</head>
<body>
<header class="top"><span class="brand">小夜 · CPA 管理台</span><span class="readonly">只读模式</span></header>
<main class="wrap">
<div class="heading"><div><h1>运行概览</h1><p>模型、权限、聚合渠道和服务状态集中展示。此页面不能修改配置。</p></div><button class="refresh" id="refresh">刷新数据</button></div>
<div class="metrics" id="metrics"></div>
<div class="tabs" role="tablist"><button class="tab active" data-tab="models">模型目录</button><button class="tab" data-tab="access">Key 权限</button><button class="tab" data-tab="pools">聚合池</button><button class="tab" data-tab="services">服务状态</button></div>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="搜索当前页面…"><span id="updated" class="foot"></span></div>
<div id="content"><div class="card empty">正在读取服务器状态…</div></div>
<div class="foot">数据仅来自本机只读 API · 不展示任何明文 Key · 修改配置仍需使用 cpa-admin 并经过审批</div>
</main>
<script>
let state={data:null,tab:'models',query:''};
const content=document.getElementById('content');
const esc=value=>String(value??'');
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function pill(text,off=false){return node('span','pill'+(off?' off':''),text)}
function table(headers,rows){const wrap=node('div','table-wrap');const tableEl=node('table');const thead=node('thead');const tr=node('tr');headers.forEach(h=>tr.append(node('th','',h)));thead.append(tr);tableEl.append(thead);const tbody=node('tbody');rows.forEach(values=>{const row=node('tr');values.forEach(value=>{const cell=node('td');if(value instanceof Node)cell.append(value);else cell.textContent=esc(value);row.append(cell)});tbody.append(row)});tableEl.append(tbody);wrap.append(tableEl);return wrap}
function filtered(items,fields){const q=state.query.toLowerCase();return items.filter(item=>fields.map(f=>esc(f(item)).toLowerCase()).join(' ').includes(q))}
function renderModels(){let models=filtered(state.data.models,[m=>m.id,m=>m.display_name,m=>(m.reasoning?.efforts||[]).join(' ')]);if(!models.length)return node('div','empty','没有匹配的模型');return table(['模型','模态','上下文 / 输出','思考强度','状态'],models.map(m=>{const id=node('div');id.append(node('strong','',m.display_name||m.id),document.createElement('br'),node('code','',m.id));return[id,(m.modalities?.input||[]).join(' / '),`${m.limits?.context??'-'} / ${m.limits?.max_output??'-'}`,m.reasoning?.supported?(m.reasoning.efforts||[]).join(' / ')||'支持':'不支持',m.enabled===false?pill('停用',true):pill('启用')]}))}
function renderAccess(){const grid=node('div','grid');const policies=state.data.policies;const items=filtered(state.data.principals,[p=>p.name,p=>(p.policies||[]).join(' ')]);items.forEach(p=>{const card=node('div','item');const title=node('div');title.append(node('strong','',p.name),' ',p.disabled?pill('已停用',true):pill('启用'));card.append(title,node('p','',`RPM：${p.limits?.rpm??0} · 策略：${(p.policies||[]).join(', ')}`));const models=[];(p.policies||[]).forEach(name=>(policies[name]?.allow_models||[]).forEach(m=>models.push(m)));card.append(node('p','','模型：'+models.join(' · ')));const endpoints=Object.entries(p.endpoints||{}).map(([name,on])=>name+':'+(on?'允许':'拒绝')).join(' · ');card.append(node('p','',endpoints));grid.append(card)});return grid}
function renderPools(){const grid=node('div','grid');const items=filtered(state.data.pools,[p=>p.id,p=>p.channels.map(c=>c.provider+' '+c.name).join(' ')]);items.forEach(p=>{const card=node('div','item');const enabled=p.channels.filter(c=>c.enabled).length;card.append(node('strong','',p.id),node('p','',`${p.strategy} · ${enabled}/${p.channels.length} 渠道启用`));const list=node('div','channels');p.channels.forEach(c=>{const row=node('div','channel');const info=node('div');info.append(node('code','',c.id),document.createElement('br'),node('small','',`${c.provider} → ${c.name}${c.priority===null||c.priority===undefined?'':' · 优先级 '+c.priority}`));row.append(info,c.enabled?pill('启用'):pill('停用',true));list.append(row)});card.append(list);grid.append(card)});return grid}
function renderServices(){return table(['服务','状态'],filtered(state.data.services,[s=>s.name,s=>s.status]).map(s=>[s.name,s.status==='active'?pill('active'):pill(s.status,true)]))}
function render(){if(!state.data)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));content.replaceChildren();const card=node('div','card');const titles={models:'模型能力目录',access:'下游 Key 权限（已脱敏）',pools:'公开模型与上游渠道',services:'相关服务健康状态'};card.append(node('h2','',titles[state.tab]));card.append(({models:renderModels,access:renderAccess,pools:renderPools,services:renderServices})[state.tab]());content.append(card);document.getElementById('updated').textContent='更新于 '+new Date(state.data.generated_at).toLocaleString()}
async function load(){const button=document.getElementById('refresh');button.disabled=true;try{const response=await fetch(location.origin+'/cpa-admin/api/overview',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);state.data=await response.json();const summary=state.data.summary;const metrics=[['模型',summary.models],['启用模型',summary.enabled_models],['下游身份',summary.principals],['聚合池',summary.pools],['上游渠道',summary.channels]];const metricBox=document.getElementById('metrics');metricBox.replaceChildren();metrics.forEach(([label,value])=>{const card=node('div','metric');card.append(node('strong','',value),node('span','',label));metricBox.append(card)});render()}catch(error){content.replaceChildren(node('div','error','读取失败：'+error.message))}finally{button.disabled=false}}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{state.tab=button.dataset.tab;render()}));document.getElementById('search').addEventListener('input',event=>{state.query=event.target.value;render()});document.getElementById('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
